[package]
name = "no-cutscene-kiseki"
version = "0.0.2"
edition = "2021"

[lib]
name = "common"
path = "src/lib.rs"

[[bin]]
name = "launch"

[profile.release]
# runtime performance is basically irrelevant, so we optimize for binary size as far as possible.
opt-level = "z"
lto = true
strip = true

[dependencies]
atty = { git = "https://github.com/softprops/atty.git", rev = "6633c0e1446aa19e6cd00e00e39770da43081bda" }
anyhow = "1.0.70"
blake2 = "0.10.5"
clap = { version = "4.1", default-features = false, features = ["std", "derive"] }
fltk = "1.4.0"
generic-array = "0.14.7"
hex-literal = "0.3.4"
windows = { version = "0.48.0", features = [ "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_System_Threading" ]}
